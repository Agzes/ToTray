[package]
name = "totray"
version = "1.0.0"
edition = "2024"
description = "AutoRun utility for hyprland."
repository = "https://github.com/Agzes/totray"
license = "MIT"
keywords = ["tray", "hyprland"]
categories = ["os-linux", "gui", "utilities"]

[dependencies]
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "wayland",
    "x11",
    "tokio",
    "image",
    "svg",
    "advanced",
    "web-colors",
    "crisp",
    "linux-theme-detection",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ksni = { version = "0.3.6", features = ["blocking"] }
clap = { version = "4.5", features = ["derive"] }
image = "0.25"
notify-rust = "4.11"
dirs = "5.0"

[package.metadata.appimage]
name = "ToTray"
icon = "assets/logo.png"
desktop_entry = "totray.desktop"
auto_link = true
category = "Utility"

[package.metadata.deb]
name = "totray"
maintainer = "agzes <agzes0@proton.me>"
copyright = "2026, agzes"
license-file = ["LICENSE"]
extended-description = "AutoRun and Tray Manager for Hyprland"
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    [
        "target/release/totray",
        "usr/bin/totray",
        "755",
    ],
    [
        "totray.desktop",
        "usr/share/applications/totray.desktop",
        "644",
    ],
    [
        "assets/logo.png",
        "usr/share/icons/hicolor/256x256/apps/totray.png",
        "644",
    ],
    [
        "assets/logo.png",
        "usr/share/pixmaps/totray.png",
        "644",
    ],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/totray", dest = "/usr/bin/totray", mode = "755" },
    { source = "totray.desktop", dest = "/usr/share/applications/totray.desktop", mode = "644" },
    { source = "assets/logo.png", dest = "/usr/share/icons/hicolor/256x256/apps/totray.png", mode = "644" },
    { source = "assets/logo.png", dest = "/usr/share/pixmaps/totray.png", mode = "644" },
]
